apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-app
  namespace: student-system

spec:

  replicas: 2

  selector:
    matchLabels:
      app: student-app

  template:

    metadata:
      labels:
        app: student-app

    spec:

      containers:

        - name: student-app
          image: student-app:1.0

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 5000
