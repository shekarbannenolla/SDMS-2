version: "3.8"

services:

  app:
    build: .
    container_name: student_app

    ports:
      - "5000:5000"

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0

    container_name: student_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: student_db
      MYSQL_USER: student
      MYSQL_PASSWORD: student123

    volumes:
      - student_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:

  student_data:
